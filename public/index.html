<!DOCTYPE html>
<html>
<head>
<title>DANGER-MD PANEL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#0a0a0a;color:#00ff88;font-family:monospace;text-align:center;padding:50px}
input,button{padding:12px;margin:10px;border:none;border-radius:5px}
input{width:250px;background:#1a1a1a;color:#00ff88}
button{background:#00ff88;color:#000;cursor:pointer;font-weight:bold}
.box{border:1px solid #00ff88;padding:20px;border-radius:10px;max-width:400px;margin:auto}
h1{text-shadow:0 0 10px #00ff88}
</style>
</head>
<body>
<h1>⚡ DANGER-MD V10.44 PANEL</h1>
<div class="box">
<h3>PAIR NEW BOT</h3>
<input id="num" placeholder="Enter number: 2348142334779">
<br>
<button onclick="pair()">GET PAIRING CODE</button>
<p id="msg"></p>
</div>
<script>
async function pair(){
let n=document.getElementById('num').value;
if(!n){alert('Enter number');return}
document.getElementById('msg').innerText='Generating code...';
let res=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number:n})});
let data=await res.json();
if(data.success){document.getElementById('msg').innerText='Check WhatsApp for pairing code ✅'}
else{document.getElementById('msg').innerText='Error: '+data.error}
</script>
</body>
</html>
