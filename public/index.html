<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DANGER-MD PANEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Courier New', monospace}
body{background:#050505;color:#00ff41;padding:15px;min-height:100vh}
.header{text-align:center;margin-bottom:20px}
.header h1{color:#00ff41;font-size:22px;text-shadow:0 0 10px #00ff41}
.header p{font-size:12px;color:#888}
.input-box{display:flex;gap:10px;margin-bottom:20px}
input{flex:1;background:#111;border:2px solid #00ff41;color:#00ff41;padding:14px;border-radius:8px;font-size:16px;outline:none}
input::placeholder{color:#555}
button{background:#00ff41;color:#000;border:none;padding:14px 20px;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
button:active{transform:scale(0.95)}
.grid{display:grid;gap:12px}
.card{background:#111;border:1px solid #00ff41;border-radius:10px;padding:12px;animation:fadeIn 0.3s}
.card b{color:#00ff41;font-size:16px}
.card .code{font-size:20px;letter-spacing:3px;margin:8px 0;padding:10px;background:#000;border-radius:5px;text-align:center;color:#fff}
.card .status{font-size:12px;padding:4px 8px;border-radius:4px;display:inline-block}
.status.waiting{background:#ffaa00;color:#000}
.status.connected{background:#00ff41;color:#000}
